<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuestros restaurantes</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="pagina">
    <div class="caja">
      <h1>Elige el restaurante</h1>
      <p>Mira la carta, pide y paga en línea.</p>
      <div class="lista-rest" id="lista"></div>
    </div>
  </main>
  <script>
    const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    fetch('/api/restaurantes').then((r) => r.json()).then((lista) => {
      document.getElementById('lista').innerHTML = lista.map((r) => `
        <a href="/r/${esc(r.slug)}">
          <div class="logo" style="background:${esc(r.colorPrimario)}">${r.logo ? `<img src="${esc(r.logo)}" alt="" style="${r.logoAncho ? 'object-fit:contain;padding:6px' : ''}">` : esc(r.nombre[0])}</div>
          <div><strong>${esc(r.nombre)}</strong><br><small style="color:var(--suave)">${esc(r.eslogan || '')}${r.abierto ? '' : ' · Cerrado'}</small></div>
        </a>`).join('');
    });
  </script>
</body>
</html>
